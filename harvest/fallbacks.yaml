# Harvested from quantum-free-router configs/hermes-fallback.example.yaml
# ALTRON uses this order when the primary NVIDIA model fails.

primary:
  provider: nvidia-nim
  model: nvidia/nemotron-3-super-120b-a12b
  base_url: https://integrate.api.nvidia.com/v1

fallbacks:
  - provider: nvidia-nim
    model: nvidia/nemotron-3-super-120b-a12b
  - provider: nvidia-nim
    model: nvidia/llama-3.1-nemotron-70b-instruct
