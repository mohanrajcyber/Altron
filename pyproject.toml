[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "altron"
version = "0.8.0"
description = "ALTRON core — original brain that harvests local Git references as adapters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ALTRON" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "openai>=1.50.0",
  "pydantic>=2.7.4",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
desktop = ["pywebview>=5.0"]
browser = ["playwright>=1.40.0"]
e2b = ["e2b-code-interpreter>=1.0.0"]
build = ["pyinstaller>=6.0.0"]
organs = ["playwright>=1.40.0", "e2b-code-interpreter>=1.0.0", "pywebview>=5.0", "pyinstaller>=6.0.0", "pillow>=10.0.0"]
vision = ["pillow>=10.0.0"]

[project.scripts]
altron = "altron.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["altron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
